<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EducaFlex | Aula & Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configuração de fontes e cores -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a2e; /* Fundo escuro */
            color: #ffffff; /* Texto claro */
        }
        .sidebar {
            background-color: #0f0f1a; /* Sidebar mais escura */
        }
        .youtube-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 0.75rem; /* rounded-xl */
        }
        .youtube-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="min-h-screen flex">

    <!-- 1. Sidebar (Minimalista para a aula) -->
    <aside class="sidebar w-64 p-6 flex flex-col justify-between shadow-xl fixed min-h-screen">
        <div>
            <h1 class="text-3xl font-extrabold text-indigo-400 mb-10">EducaFlex</h1>
            <nav class="space-y-4">
                <!-- Ajuste o link para o seu dashboard.html -->
                <a href="dashboard.html" class="flex items-center space-x-3 p-3 text-gray-400 hover:bg-gray-800 rounded-lg transition duration-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                    <span>Voltar ao Dashboard</span>
                </a>
            </nav>
            
            <div class="mt-10 pt-4 border-t border-gray-700">
                <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">Aulas da Trilha</h3>
                <ul id="lista-aulas" class="space-y-2 text-sm">
                    <!-- Aulas serão carregadas dinamicamente aqui -->
                    <li class="text-gray-500">Carregando...</li>
                </ul>
            </div>
        </div>
        
        <button onclick="window.location.href = 'dashboard.html'" class="flex items-center justify-center space-x-3 p-3 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg transition duration-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
            <span>Sair</span>
        </button>
    </aside>

    <!-- 2. Conteúdo Principal da Aula -->
    <main class="flex-1 p-8 ml-64">
        
        <!-- Título da Trilha e Aula -->
        <header class="mb-8">
            <p id="trilha-nome" class="text-gray-400 text-sm font-medium uppercase"></p>
            <h2 id="aula-titulo" class="text-3xl font-extrabold text-white mt-1">Carregando Título da Aula...</h2>
        </header>

        <!-- Container do Vídeo do YouTube -->
        <section id="video-section" class="mb-12">
            <div class="youtube-container bg-gray-900 flex items-center justify-center">
                <p id="video-placeholder" class="text-gray-500 text-lg">Carregando vídeo...</p>
                <!-- O iframe será injetado aqui -->
            </div>
        </section>

        <!-- Seção do Quiz (Inicialmente oculta) -->
        <section id="quiz-section" class="bg-gray-800 p-6 rounded-xl shadow-2xl border border-indigo-700 hidden">
            <h3 class="text-xl font-bold text-indigo-400 mb-6">Quiz Rápido</h3>
            
            <p id="quiz-pergunta" class="text-lg font-semibold mb-6"></p>

            <div id="quiz-opcoes" class="space-y-4">
                <!-- Opções serão injetadas aqui -->
            </div>

            <button id="submit-quiz-btn" class="mt-8 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200 w-full disabled:opacity-50" disabled>
                Verificar Resposta
            </button>
            
            <div id="quiz-feedback" class="mt-4 p-3 rounded-lg text-center font-semibold hidden"></div>
        </section>

        <!-- Botões de Navegação -->
        <section class="flex justify-between mt-12">
            <button id="prev-aula-btn" onclick="navegarAula(-1)" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg transition duration-200 disabled:opacity-30 flex items-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                <span>Aula Anterior</span>
            </button>
            <button id="next-aula-btn" onclick="navegarAula(1)" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200 disabled:opacity-30 flex items-center space-x-2">
                <span>Próxima Aula / Quiz</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
            </button>
        </section>

    </main>

    <!-- 3. Scripts JS -->
    <script src="trilhas.js"></script> <!-- AQUI ELE CARREGA O SEU ARQUIVO DE DADOS -->
    <script>
        // Variáveis de estado global
        let currentTrilhaId;
        let currentAulaId;
        let trilhaData;
        let quizData;
        let isQuizAnswered = false; // Flag para evitar múltiplas respostas no quiz

        // =========================================================================
        // Funções de Utilitário
        // =========================================================================

        // Função para obter parâmetros da URL
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            const results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        // Simulação do alert para evitar problemas de iframe
        window.alert = function(message) {
            const modal = document.createElement('div');
            modal.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: flex; justify-content: center; align-items: center; z-index: 1000;';
            modal.innerHTML = `
                <div class="bg-gray-900 p-8 rounded-xl shadow-2xl max-w-sm w-full text-white">
                    <h4 class="text-xl font-bold mb-4 text-indigo-400">Aviso</h4>
                    <p class="mb-6">${message}</p>
                    <button onclick="this.closest('[style*=\'position: fixed\']').remove()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-lg transition duration-200">
                        Entendi
                    </button>
                </div>
            `;
            document.body.appendChild(modal);
        };

        // =========================================================================
        // Funções de Renderização
        // =========================================================================

        // 1. Renderiza o vídeo do YouTube
        function renderVideo(videoId) {
            const videoContainer = document.querySelector('.youtube-container');
            const placeholder = document.getElementById('video-placeholder');
            
            if (videoId) {
                // Se houver vídeo, injeta o iframe
                placeholder.classList.add('hidden');
                videoContainer.innerHTML = `
                    <iframe 
                        src="https://www.youtube.com/embed/${videoId}?rel=0" 
                        title="YouTube video player" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen
                    ></iframe>
                `;
            } else {
                // Se não houver vídeo (por exemplo, aula teórica sem vídeo)
                placeholder.classList.remove('hidden');
                placeholder.textContent = 'Recurso de vídeo indisponível para esta aula.';
                videoContainer.innerHTML = '';
            }
        }

        // 2. Renderiza o Quiz
        function renderQuiz() {
            const quizSection = document.getElementById('quiz-section');
            const perguntaEl = document.getElementById('quiz-pergunta');
            const opcoesEl = document.getElementById('quiz-opcoes');
            const submitBtn = document.getElementById('submit-quiz-btn');
            const feedbackEl = document.getElementById('quiz-feedback');
            
            // Limpa o estado anterior
            opcoesEl.innerHTML = '';
            feedbackEl.classList.add('hidden');
            feedbackEl.textContent = '';
            submitBtn.disabled = true;
            isQuizAnswered = false;

            // Busca os dados do quiz
            // Esta função usa a implementação de getQuiz do seu trilhas.js
            quizData = getQuiz(currentTrilhaId, currentAulaId);

            if (!quizData || !quizData.pergunta || quizData.opcoes.length === 0) {
                // Esconde a seção se não houver quiz
                quizSection.classList.add('hidden');
                document.getElementById('next-aula-btn').textContent = 'Próxima Aula';
                return;
            }

            // Exibe a seção e define a pergunta
            quizSection.classList.remove('hidden');
            document.getElementById('next-aula-btn').textContent = 'Próxima Aula / Quiz';
            perguntaEl.textContent = quizData.pergunta;

            // Cria as opções
            quizData.opcoes.forEach((opcao, index) => {
                const label = document.createElement('label');
                label.className = 'flex items-center space-x-3 p-4 bg-gray-700 rounded-lg cursor-pointer hover:bg-gray-600 transition duration-150';
                label.innerHTML = `
                    <input type="radio" name="quiz-opcao" value="${opcao}" class="form-radio h-5 w-5 text-indigo-500 bg-gray-900 border-gray-600 focus:ring-indigo-500" data-index="${index}">
                    <span class="font-medium">${opcao}</span>
                `;
                opcoesEl.appendChild(label);
            });

            // Adiciona listener para habilitar o botão de submissão
            opcoesEl.querySelectorAll('input[type="radio"]').forEach(radio => {
                radio.addEventListener('change', () => {
                    if (!isQuizAnswered) {
                        submitBtn.disabled = false;
                    }
                });
            });

            // Adiciona listener para submeter a resposta
            submitBtn.onclick = checkQuizAnswer;
        }

        // 3. Renderiza a lista de aulas na Sidebar
        function renderSidebarAulas() {
            const listaEl = document.getElementById('lista-aulas');
            listaEl.innerHTML = ''; // Limpa a lista

            if (!trilhaData || !trilhaData.aulas) {
                listaEl.innerHTML = `<li class="text-red-400">Erro ao carregar lista.</li>`;
                return;
            }

            trilhaData.aulas.forEach(aula => {
                // A navegação aqui usa o ID da aula, que é um número, e o ID da trilha, que é uma string.
                const isCurrent = aula.id == currentAulaId;
                const li = document.createElement('li');
                
                let aulaClass = 'text-gray-400 hover:text-white';
                if (isCurrent) {
                    aulaClass = 'text-indigo-400 font-bold bg-gray-700 p-2 rounded-lg';
                }

                li.innerHTML = `
                    <a href="trilha_video_quiz.html?trilhaId=${currentTrilhaId}&aulaId=${aula.id}" class="block transition duration-150 ${aulaClass}">
                        ${aula.titulo}
                    </a>
                `;
                listaEl.appendChild(li);
            });
        }

        // =========================================================================
        // Funções de Lógica
        // =========================================================================

        // Verifica a resposta do quiz
        function checkQuizAnswer() {
            if (isQuizAnswered) return; // Não permite responder novamente

            const opcoes = document.getElementsByName('quiz-opcao');
            let selectedOption = null;
            opcoes.forEach(radio => {
                if (radio.checked) {
                    selectedOption = radio.value;
                }
            });

            const feedbackEl = document.getElementById('quiz-feedback');
            feedbackEl.classList.remove('hidden', 'bg-red-900', 'bg-green-900');
            
            if (!selectedOption) {
                feedbackEl.textContent = 'Por favor, selecione uma opção antes de verificar.';
                feedbackEl.classList.add('bg-red-900');
                return;
            }
            
            if (selectedOption === quizData.respostaCorreta) {
                feedbackEl.textContent = 'Parabéns! Resposta correta!';
                feedbackEl.classList.add('bg-green-900');
            } else {
                feedbackEl.textContent = `Resposta incorreta. A correta é: ${quizData.respostaCorreta}`;
                feedbackEl.classList.add('bg-red-900');
            }

            isQuizAnswered = true;
            document.getElementById('submit-quiz-btn').disabled = true;
        }

        // Função para navegar entre aulas
        function navegarAula(direcao) {
            const currentIndex = trilhaData.aulas.findIndex(a => a.id == currentAulaId);
            const nextIndex = currentIndex + direcao;

            if (nextIndex >= 0 && nextIndex < trilhaData.aulas.length) {
                const nextAula = trilhaData.aulas[nextIndex];
                window.location.href = `trilha_video_quiz.html?trilhaId=${currentTrilhaId}&aulaId=${nextAula.id}`;
            } else if (direcao === 1 && nextIndex >= trilhaData.aulas.length) {
                // Fim da trilha
                alert('Você concluiu todas as aulas desta trilha por enquanto! Voltando ao Dashboard.');
                window.location.href = 'dashboard.html';
            }
        }
        
        // Atualiza os botões de navegação (Primeira e Última aula)
        function updateNavigationButtons() {
            if (!trilhaData) return;
            const currentIndex = trilhaData.aulas.findIndex(a => a.id == currentAulaId);
            
            document.getElementById('prev-aula-btn').disabled = currentIndex === 0;
            document.getElementById('next-aula-btn').disabled = false; 
        }


        // =========================================================================
        // Inicialização
        // =========================================================================
        
        function init() {
            // 1. Obtém os IDs da URL
            currentTrilhaId = getUrlParameter('trilhaId');
            currentAulaId = parseInt(getUrlParameter('aulaId')) || 1; // Default para a primeira aula

            // 2. Verifica se a função de dados existe - Isto verifica se trilhas.js foi carregado
            // Nota: O seu trilhas.js usa a função getTrilhaById, então vou verificar ela.
            if (typeof getTrilhaById !== 'function') {
                document.getElementById('aula-titulo').textContent = 'Erro de Inicialização: Dependência não carregada';
                document.getElementById('trilha-nome').textContent = 'O arquivo trilhas.js (dados mock) não foi carregado. Verifique se o nome do arquivo no HTML está correto.';
                console.error("Erro: A função getTrilhaById não foi encontrada. Verifique se trilhas.js está carregado.");
                return;
            }

            // 3. Busca os dados da trilha e da aula
            trilhaData = getTrilhaById(currentTrilhaId);
            const aulaData = getAula(currentTrilhaId, currentAulaId);

            if (!trilhaData || !aulaData) {
                document.getElementById('aula-titulo').textContent = 'Conteúdo Não Encontrado';
                document.getElementById('trilha-nome').textContent = 'Verifique se a trilha ou aula ID estão corretos na URL.';
                renderVideo(null);
                document.getElementById('quiz-section').classList.add('hidden');
                return;
            }

            // 4. Renderiza o conteúdo principal
            document.getElementById('trilha-nome').textContent = trilhaData.nome;
            document.getElementById('aula-titulo').textContent = aulaData.titulo;
            
            renderVideo(aulaData.videoId);
            renderQuiz();
            
            // 5. Renderiza a sidebar e botões
            renderSidebarAulas();
            updateNavigationButtons();
        }

        // Executa a função de inicialização
        window.onload = init;
    </script>
</body>
</html>
