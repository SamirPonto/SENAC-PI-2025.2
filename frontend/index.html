<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>EducaFlex — Login</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="container">
    <div class="header mb-3">
      <div class="logo">EducaFlex</div>
      <div><a href="register.html" class="btn btn-outline-secondary">Criar Conta</a></div>
    </div>

    <h2>Login</h2>
    <div class="card p-3">
      <div id="msg" class="small text-danger mb-2"></div>
      <label class="form-label">Email</label>
      <input id="email" type="email" class="form-control mb-2">
      <label class="form-label">Senha</label>
      <input id="password" type="password" class="form-control mb-2">
      <div class="mt-2">
        <button id="btnLogin" class="btn btn-primary">Entrar</button>
      </div>
    </div>
    <div class="footer-note mt-2">Caso não possua conta, clique em Criar Conta.</div>
  </div>

<script>
const base = '/educaflex/backend';
document.getElementById('btnLogin').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  msg.textContent = '';
  if (!email || !password) { msg.textContent = 'Preencha email e senha.'; return; }
  try {
    const res = await fetch(base + '/auth/login.php', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email,password})
    });
    const data = await res.json();
    if (data.success) {
      window.location.href = '/educaflex/frontend/dashboard.html';
    } else {
      msg.textContent = data.error || 'Erro ao logar';
    }
  } catch (e) {
    msg.textContent = 'Erro de conexão';
  }
});
</script>
</body>
</html>
