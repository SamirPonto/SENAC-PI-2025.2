<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>EducaFlex — Trilha</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="container">
    <div class="header mb-3 d-flex align-items-center justify-content-between">
      <div class="logo">EducaFlex</div>
      <div><a href="dashboard.html" class="btn btn-outline-secondary">Voltar</a></div>
    </div>

    <h2 id="trailTitle">Trilha</h2>
    <div id="modulesList" class="card p-2"></div>
    <div class="mt-3">
      <strong>Progresso da trilha:</strong> <span id="trailProgress">0%</span>
      <div class="progress mt-2" style="height:12px"><div id="trailFill" class="progress-bar bg-primary" role="progressbar" style="width:0%"></div></div>
    </div>
  </div>

<script>
const base = '/educaflex/backend';
const params = new URLSearchParams(window.location.search);
const trail_id = params.get('trail_id');
if (!trail_id) {
  document.getElementById('modulesList').textContent = 'Trilha não informada';
}
async function loadModules(){
  try {
    const res = await fetch(base + `/api/get_modules.php?trail_id=${trail_id}`);
    const data = await res.json();
    const box = document.getElementById('modulesList');
    box.innerHTML = '';
    if (!data.modules || !data.modules.length) { box.textContent = 'Nenhum módulo'; return; }
    data.modules.forEach(m => {
      const div = document.createElement('div');
      div.className = 'module-row';
      div.innerHTML = `
        <div>
          <div class="module-title">${m.module_order}. ${m.title}</div>
          <div class="small">${m.type} ${m.content_url ? '• ' + m.content_url : ''}</div>
        </div>
        <div style="text-align:right">
          <div class="small">Concluído: ${m.percentage || 0}%</div>
          <div style="margin-top:8px">
            <button class="btn btn-sm btn-outline-secondary" onclick="openModule(${m.id}, '${encodeURIComponent(m.title)}', '${m.type}', '${m.content_url||''}')">Abrir</button>
            <button class="btn btn-sm btn-primary" onclick="markProgress(${m.id})">Marcar 100%</button>
          </div>
        </div>
      `;
      box.appendChild(div);
    });
    updateTrailProgress();
  } catch (e) {
    document.getElementById('modulesList').textContent = 'Erro ao carregar módulos';
  }
}
function openModule(moduleId, titleEscaped, type, url) {
  const title = decodeURIComponent(titleEscaped);
  if (url) {
    window.open(url, '_blank');
  } else {
    alert('Abrindo módulo: ' + title + ' (tipo: ' + type + ')');
  }
}
async function markProgress(moduleId){
  try {
    const res = await fetch(base + '/api/update_progress.php', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({module_id: moduleId, percentage: 100})
    });
    const data = await res.json();
    if (data.success) {
      await loadModules();
    } else {
      alert(data.error || 'Erro ao atualizar progresso');
    }
  } catch (e) {
    alert('Erro de conexão');
  }
}
async function updateTrailProgress(){
  try {
    const res = await fetch(base + `/api/get_progress.php?trail_id=${trail_id}`);
    const data = await res.json();
    const p = data.progress || 0;
    document.getElementById('trailProgress').textContent = p + '%';
    document.getElementById('trailFill').style.width = p + '%';
  } catch (e) {}
}
async function loadTrailTitle(){
  try {
    const res = await fetch(base + '/api/get_trails.php');
    const data = await res.json();
    const t = data.trails.find(x => String(x.id) === String(trail_id));
    document.getElementById('trailTitle').textContent = t ? t.title : 'Trilha';
  } catch (e) {}
}
loadTrailTitle();
loadModules();
</script>
</body>
</html>
