<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>EducaFlex — Trilhas</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="container">
    <div class="header mb-3 d-flex align-items-center justify-content-between">
      <div class="logo">EducaFlex</div>
      <div>
                <button id="btnLogout" class="btn btn-outline-secondary">Sair</button>
      </div>
    </div>

    <h2>Trilhas de Estudo</h2>
    
        <div id="trailsList" class="grid">
          </div>
    
    <div class="footer-note mt-2">Clique em "Acessar" para abrir a trilha e ver módulos.</div>
  </div>

<script src="assets/script.js"></script> 

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // **IMPORTANTE**: Use o ID real de um ALUNO (Student) do seu banco de dados.
        // Se você não tem certeza, use o '1' por enquanto, assumindo que foi o primeiro criado.
        getTrails(1); 
        
        // Exemplo: Adicionando o listener de Sair/Logout de volta, que não está no script.js ainda.
        // O ideal é adicionar esta lógica no seu script.js, dentro do DOMContentLoaded.
        document.getElementById('btnLogout').addEventListener('click', () => {
             // Este URL de redirecionamento precisa ser ajustado com base no seu roteamento
             window.location.href = 'index.html'; 
        });
    });
</script>
</body>
</html>
