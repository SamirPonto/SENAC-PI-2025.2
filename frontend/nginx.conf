server {
    listen 80;

    # Define o diretório onde o Nginx buscará os arquivos estáticos (copiados no Dockerfile)
    root /usr/share/nginx/html;
    index index.html;

    # Regra principal: serve os arquivos estáticos (HTML, JS, CSS)
    location / {
        try_files $uri $uri/ =404;
    }

    # Regra de Proxy: Encaminha todas as requisições que começam com /v1/ 
    # para o serviço backend rodando na porta 8000 dentro da rede Docker.
    location /v1/ {
        # CRÍTICO: Usa o nome do serviço 'backend' do docker-compose como hostname
        proxy_pass http://backend:8000;

        # Configurações padrão de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}