<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>EducaFlex — Detalhes da Trilha</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="container">
    <div class="header mb-3 d-flex align-items-center justify-content-between">
      <div class="logo">EducaFlex</div>
      <div><a href="dashboard.html" class="btn btn-outline-secondary">Voltar às Trilhas</a></div>
    </div>

        <h2 id="trailTitle">Carregando Trilha...</h2>
    <p class="small text-muted" id="trailDescription"></p>

    <h3>Módulos</h3>
    <div id="moduleList">
            <p>Carregando módulos...</p>
    </div>
    
        <div class="mt-3">
      <strong>Progresso da trilha:</strong> <span id="trailProgress">0%</span>
      <div class="progress mt-2" style="height:12px"><div id="trailFill" class="progress-bar bg-primary" role="progressbar" style="width:0%"></div></div>
    </div>
  </div>

<script src="assets/script.js"></script> 

<script>
    // Funções auxiliares (openModule e updateTrailProgress) podem ser movidas para script.js se necessário,
    // mas a principal chamada de carregamento fica aqui.

    document.addEventListener('DOMContentLoaded', () => {
        // 1. Extrai o 'trail_id' da URL (Ex: trail.html?trail_id=1)
        const urlParams = new URLSearchParams(window.location.search);
        const trailId = urlParams.get('trail_id');
        
        // 2. Simula o ID do usuário logado (Aluno) - usar o ID que você definiu no dashboard
        const userId = 1; 

        if (trailId) {
            // CHAMA A FUNÇÃO CENTRAL DO PASSO 4 NO script.js
            getTrailDetails(trailId, userId);
            // Chamar a função para atualizar o progresso (se for implementada separadamente)
            // updateTrailProgress(trailId, userId); 
        } else {
            document.getElementById('moduleList').innerHTML = '<p class="text-danger">ID da trilha não especificado na URL.</p>';
            document.getElementById('trailTitle').textContent = 'Erro';
        }
    });
    
    // Nota: A função updateProgress(moduleId, userId) já existe no script.js como placeholder.
</script>
</body>
</html>
