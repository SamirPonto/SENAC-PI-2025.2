<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>EducaFlex — Trilhas</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="container">
    <div class="header mb-3 d-flex align-items-center justify-content-between">
      <div class="logo">EducaFlex</div>
      <div>
        <button id="btnLogout" class="btn btn-outline-secondary">Sair</button>
      </div>
    </div>

    <h2>Trilhas de Estudo</h2>
    <div id="trails" class="grid"></div>
    <div class="footer-note mt-2">Clique em "Acessar" para abrir a trilha e ver módulos.</div>
  </div>

<script>
const base = '/educaflex/backend';
async function loadTrails(){
  try {
    const res = await fetch(base + '/api/get_trails.php');
    const data = await res.json();
    const container = document.getElementById('trails');
    container.innerHTML = '';
    if (!data.trails) { container.textContent = 'Nenhuma trilha encontrada'; return; }
    data.trails.forEach(t => {
      const el = document.createElement('div');
      el.className = 'card trail-card';
      el.innerHTML = `
        <h3>${t.title}</h3>
        <p class="small">${t.description || ''}</p>
        <div class="progress-bar" style="margin:8px 0">
          <div class="progress-fill" style="width:${t.progress || 0}%"></div>
        </div>
        <div class="small">Progresso: ${t.progress || 0}% • Módulos: ${t.modules_count}</div>
        <div style="margin-top:10px"><button class="btn btn-sm btn-primary" onclick="openTrail(${t.id})">Acessar</button></div>
      `;
      container.appendChild(el);
    });
  } catch (e) {
    document.getElementById('trails').textContent = 'Erro ao carregar trilhas';
  }
}
function openTrail(id){
  window.location.href = `trail.html?trail_id=${id}`;
}
document.getElementById('btnLogout').addEventListener('click', async () => {
  await fetch(base + '/auth/logout.php');
  window.location.href = '/educaflex/frontend/index.html';
});
loadTrails();
</script>
</body>
</html>
