version: "3.9"

services:
  db:
    image: postgres:17
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    volumes:
      # Se o volume nomeado 'db_data' for usado no final do arquivo,
      # é melhor usar 'db_data:/var/lib/postgresql/data' aqui.
      # Se não for, mantenha o volume anônimo ou remova a linha, mas removendo a palavra 'frontend'.
      - /var/lib/postgresql/data 
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: backend_api
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://myuser:mypassword@db:5432/mydatabase
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: frontend_app
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80" # CORRIGIDO: Mapeando 3000 no host para 80 no container

volumes:
  db_data:
